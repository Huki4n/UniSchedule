name: Dispatch Cursor Autofix

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.run_attempt == 1 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AUTOFIX_REVIEWER_LOGIN != '' &&
      github.event.review.user.login == vars.AUTOFIX_REVIEWER_LOGIN &&
      github.event.review.state != 'approved' &&
      contains(github.event.review.body, '[AUTOFIX_REQUIRED]')

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Send review event to Cursor
        shell: bash
        env:
          CURSOR_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOFIX_WEBHOOK_URL }}
          CURSOR_WEBHOOK_TOKEN: ${{ secrets.CURSOR_AUTOFIX_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          : "${CURSOR_WEBHOOK_URL:?Missing webhook URL secret}"
          : "${CURSOR_WEBHOOK_TOKEN:?Missing webhook token secret}"

          payload_path="$RUNNER_TEMP/cursor-autofix-payload.json"
          response_path="$RUNNER_TEMP/cursor-autofix-response.txt"

          jq '{
            event: "review_ready_for_autofix",
            event_key: (
              .repository.full_name
              + ":review:"
              + (.review.id | tostring)
            ),
            repository: .repository.full_name,
            pr_number: .pull_request.number,
            pr_url: .pull_request.html_url,
            head_repository: .pull_request.head.repo.full_name,
            head_branch: .pull_request.head.ref,
            head_sha: .pull_request.head.sha,
            review_id: .review.id,
            reviewed_commit: .review.commit_id,
            review_url: .review.html_url,
            reviewer: .review.user.login
          }' "$GITHUB_EVENT_PATH" > "$payload_path"

          if ! http_code="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $CURSOR_WEBHOOK_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_path" \
            --output "$response_path" \
            --write-out '%{http_code}' \
            "$CURSOR_WEBHOOK_URL")"; then
            echo "::error::Webhook delivery is uncertain. Check Cursor Run History before retrying."
            exit 1
          fi

          if [[ "$http_code" != 2* ]]; then
            echo "::error::Cursor webhook returned HTTP $http_code"
            exit 1
          fi

          echo "Cursor accepted the webhook request."
